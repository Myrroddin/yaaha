name: Package and release

# Release only tagged revisions; ordinary branch pushes do not publish packages.
on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    # These names are the BigWigs Packager contract; their values remain GitHub secrets.
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          # Complete history lets the packager generate changelogs between tags.
          fetch-depth: 0

      - name: Package and release
        uses: BigWigsMods/packager@v2
